version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: artifact_repo
      POSTGRES_USER: artifact_repo
      POSTGRES_PASSWORD: artifact_repo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py init_admin && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "local-dev-only"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_INITIAL_ADMIN_USERNAME: "admin"
      DJANGO_INITIAL_ADMIN_PASSWORD: "admin123"
      DJANGO_INITIAL_ADMIN_EMAIL: "admin@example.com"
      POSTGRES_DB: artifact_repo
      POSTGRES_USER: artifact_repo
      POSTGRES_PASSWORD: artifact_repo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A artifact_repo worker -l INFO
    volumes:
      - .:/app
      - storage_data:/app/storage
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "local-dev-only"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_INITIAL_ADMIN_USERNAME: "admin"
      DJANGO_INITIAL_ADMIN_PASSWORD: "admin123"
      DJANGO_INITIAL_ADMIN_EMAIL: "admin@example.com"
      POSTGRES_DB: artifact_repo
      POSTGRES_USER: artifact_repo
      POSTGRES_PASSWORD: artifact_repo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis

  beat:
    build: .
    command: celery -A artifact_repo beat -l INFO
    volumes:
      - .:/app
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "local-dev-only"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_INITIAL_ADMIN_USERNAME: "admin"
      DJANGO_INITIAL_ADMIN_PASSWORD: "admin123"
      DJANGO_INITIAL_ADMIN_EMAIL: "admin@example.com"
      POSTGRES_DB: artifact_repo
      POSTGRES_USER: artifact_repo
      POSTGRES_PASSWORD: artifact_repo
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  storage_data:
